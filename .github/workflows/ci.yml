name: CI

# Enforces the three quality gates that pass as of 2026-06-20:
#   pnpm build · pnpm test · pnpm lint
# (The archival plurid-canvas / plurid-html packages are excluded at the source —
#  via the `!` globs in pnpm-workspace.yaml — so the recursive root scripts skip them.)

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  # The engine's browser suite: Playwright drives the render-test harness (fixtures/render-test/e2e).
  browser:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter plurid-render-test exec playwright install --with-deps chromium
      - name: Browser suite
        run: pnpm --filter plurid-render-test e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: fixtures/render-test/test-results
